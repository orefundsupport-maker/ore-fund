name: Update Stock Master Monthly

on:
  schedule:
    - cron: '0 1 5 * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run update script
        run: node scripts/update-stock-master.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q "app/lib/stockMaster.ts"; then
            git add app/lib/stockMaster.ts
            git commit -m "chore: [auto] update stock master"
            git push origin main
          else
            echo "No changes detected."
          fi